name: mirror-to-gitee

# GitHub 是唯一源；本 workflow 把仓精确镜像到 Gitee。
# 单向设计：Gitee 侧永不被本地直接推，从结构上排除双 remote 分叉。
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 推送到 Gitee 镜像
        env:
          GITEE_SSH_KEY: ${{ secrets.GITEE_SSH_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$GITEE_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          echo "== 1) DNS 与 22 端口连通性 =="
          getent hosts gitee.com || echo "  DNS 解析失败"
          timeout 15 bash -c 'cat < /dev/null > /dev/tcp/gitee.com/22' && echo "  22 端口可达" || echo "  ⚠️ 22 端口不可达"

          echo "== 2) 取 host key =="
          timeout 20 ssh-keyscan -T 10 -t ed25519 gitee.com >> ~/.ssh/known_hosts || echo "  ⚠️ ssh-keyscan 失败 ($?)"
          echo "  known_hosts 行数: $(wc -l < ~/.ssh/known_hosts)"

          echo "== 3) SSH 认证 =="
          timeout 20 ssh -o BatchMode=yes -o ConnectTimeout=10 -T git@gitee.com || echo "  (非 0 属正常：gitee 不提供 shell)"

          echo "== 4) 清 remote-tracking refs =="
          # 🔴 `--mirror` 会连 refs/remotes/origin/* 一起推，Gitee 会拒
          # （deny updating a hidden ref）并使 job 变红，故先清掉。
          git for-each-ref --format='%(refname)' refs/remotes | while read -r r; do
            git update-ref -d "$r"
          done

          echo "== 5) mirror push =="
          git remote add gitee git@gitee.com:douxt/open-skills.git
          git push --mirror gitee
